<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Motowarehouse – Booking Card (Print)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #d0d0d0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      gap: 40px;
    }

    .instructions {
      background: #fff;
      border-radius: 6px;
      padding: 14px 20px;
      max-width: 680px;
      width: 100%;
      font-size: 13px;
      color: #555;
      line-height: 1.6;
    }
    .instructions strong { color: #CC0000; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 85mm);
      gap: 6mm;
    }

    /* Standard business card: 85 × 55 mm */
    .card {
      width: 85mm;
      height: 55mm;
      background: #0f0f0f;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      page-break-inside: avoid;
    }

    /* Red top bar */
    .card-bar {
      width: 100%;
      height: 2.5mm;
      background: #CC0000;
      flex-shrink: 0;
    }

    /* Inner layout: left text + right QR */
    .card-inner {
      display: flex;
      flex: 1;
      padding: 4mm 4mm 4mm 5mm;
      gap: 4mm;
    }

    .card-left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      min-width: 0;
    }

    .card-logo {
      height: 9mm;
      width: auto;
      object-fit: contain;
      object-position: left center;
    }

    .card-headline {
      font-size: 11.5pt;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.15;
      letter-spacing: -0.2px;
      text-transform: uppercase;
    }

    .card-services {
      font-size: 6pt;
      color: #888888;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .card-url {
      font-size: 5.5pt;
      color: #CC0000;
      letter-spacing: 0.1px;
    }

    .card-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-right canvas,
    .card-right img {
      width: 21mm !important;
      height: 21mm !important;
      display: block;
    }

    @media print {
      body { background: #fff; padding: 8mm; gap: 5mm; }
      .instructions { display: none; }
      .cards-grid { grid-template-columns: repeat(3, 85mm); gap: 4mm; }
    }
  </style>
</head>
<body>

  <div class="instructions">
    <strong>Print instructions:</strong> Ctrl + P → Paper: A4 → Margins: None → enable <strong>Background graphics</strong>. Six cards per page — cut after printing.
  </div>

  <div class="cards-grid" id="grid"></div>

  <script>
    const URL = 'https://motowarehouse-bookings.up.railway.app/';
    const grid = document.getElementById('grid');

    for (let i = 0; i < 6; i++) {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div class="card-bar"></div>
        <div class="card-inner">
          <div class="card-left">
            <img class="card-logo" src="public/assets/MWH_Logo_New.png" alt="Motowarehouse">
            <div class="card-headline">Book Your<br>Service Online</div>
            <div>
              <div class="card-services">Oil Change &nbsp;·&nbsp; Small Service &nbsp;·&nbsp; Big Service</div>
              <div class="card-url" style="margin-top:1.5mm;">${URL}</div>
            </div>
          </div>
          <div class="card-right" id="qr-${i}"></div>
        </div>
      `;

      grid.appendChild(card);

      new QRCode(document.getElementById(`qr-${i}`), {
        text: URL,
        width: 80,
        height: 80,
        colorDark: '#ffffff',
        colorLight: '#0f0f0f',
        correctLevel: QRCode.CorrectLevel.M
      });
    }
  </script>
</body>
</html>
