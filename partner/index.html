<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Portal – Motowarehouse</title>
  <style>
    @font-face { font-family:'SupremeLL'; src:url('/fonts/SupremeLLTT-Light.ttf'); font-weight:300; }
    @font-face { font-family:'SupremeLL'; src:url('/fonts/SupremeLLTT-Regular.ttf'); font-weight:400; }
    @font-face { font-family:'SupremeLL'; src:url('/fonts/SupremeLLTT-Medium.ttf'); font-weight:500; }
    @font-face { font-family:'SupremeLL'; src:url('/fonts/SupremeLLTT-Bold.ttf'); font-weight:700; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --blue:#009BB4; --blue-dark:#007a8f;
      --dark:#0a1a1f; --dark2:#0f2429; --dark3:#1a3540;
      --grey:#8a9ba0; --white:#ffffff;
      --green:#00c896; --red:#E50052; --orange:#f59e0b;
    }
    body { font-family:'SupremeLL',Arial,sans-serif; background:var(--dark); color:var(--white); min-height:100vh; font-weight:300; }

    /* ── LOGIN ── */
    .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .login-card { background:var(--dark2); border:1px solid rgba(0,155,180,0.2); border-radius:12px; padding:40px; width:100%; max-width:360px; }
    .login-brand { font-size:11px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--blue); margin-bottom:6px; }
    .login-title { font-size:22px; font-weight:700; margin-bottom:6px; }
    .login-sub { font-size:13px; color:var(--grey); margin-bottom:28px; }
    .field { margin-bottom:14px; }
    .field label { display:block; font-size:11px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--grey); margin-bottom:6px; }
    .field input { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:6px; color:var(--white); font-family:'SupremeLL',Arial,sans-serif; font-size:15px; padding:11px 14px; width:100%; outline:none; transition:border-color 0.2s; }
    .field input:focus { border-color:var(--blue); }
    .btn-primary { background:var(--blue); border:none; border-radius:6px; color:white; cursor:pointer; font-family:'SupremeLL',Arial,sans-serif; font-size:14px; font-weight:700; letter-spacing:0.08em; padding:13px; text-transform:uppercase; width:100%; transition:background 0.2s; margin-top:4px; }
    .btn-primary:hover { background:var(--blue-dark); }
    .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
    .error-msg { background:rgba(229,0,82,0.1); border:1px solid rgba(229,0,82,0.3); border-radius:6px; color:#ff6b9d; font-size:13px; padding:10px 14px; margin-top:12px; display:none; }

    /* ── APP ── */
    .app { display:none; max-width:600px; margin:0 auto; padding:20px 16px 60px; }
    .app-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid rgba(255,255,255,0.07); }
    .app-brand { font-size:11px; font-weight:500; letter-spacing:0.16em; text-transform:uppercase; color:var(--blue); }
    .app-workshop { font-size:15px; font-weight:700; margin-top:2px; }
    .btn-logout { background:none; border:1px solid rgba(255,255,255,0.1); border-radius:6px; color:var(--grey); cursor:pointer; font-family:'SupremeLL',Arial,sans-serif; font-size:12px; padding:7px 14px; transition:all 0.2s; }
    .btn-logout:hover { border-color:var(--red); color:var(--red); }

    /* ── SEARCH STEP ── */
    .step { display:none; }
    .step.active { display:block; }
    .step-title { font-size:20px; font-weight:700; margin-bottom:4px; }
    .step-sub { font-size:13px; color:var(--grey); margin-bottom:22px; }
    .plate-input-wrap { display:flex; gap:10px; }
    .plate-input { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:8px; color:var(--white); font-family:'SupremeLL',Arial,sans-serif; font-size:22px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; padding:14px 18px; flex:1; outline:none; transition:border-color 0.2s; }
    .plate-input:focus { border-color:var(--blue); }
    .btn-search { background:var(--blue); border:none; border-radius:8px; color:white; cursor:pointer; font-family:'SupremeLL',Arial,sans-serif; font-size:14px; font-weight:700; letter-spacing:0.06em; padding:14px 22px; white-space:nowrap; transition:background 0.2s; }
    .btn-search:hover { background:var(--blue-dark); }

    /* ── VEHICLE CARD ── */
    .vehicle-card { background:var(--dark2); border:1px solid rgba(0,155,180,0.25); border-radius:10px; padding:18px 20px; margin:18px 0; }
    .vehicle-plate { font-size:24px; font-weight:900; letter-spacing:0.12em; color:var(--blue); }
    .vehicle-details { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; margin-top:12px; }
    .vehicle-detail { font-size:13px; }
    .vehicle-detail span { color:var(--grey); display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:2px; }
    .btn-change { background:none; border:none; color:var(--grey); cursor:pointer; font-family:'SupremeLL',Arial,sans-serif; font-size:12px; text-decoration:underline; margin-top:10px; padding:0; }
    .btn-change:hover { color:var(--white); }

    /* ── LOG FORM ── */
    .section-title { font-size:13px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--grey); margin:22px 0 12px; }
    .checklist { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    @media(max-width:400px) { .checklist { grid-template-columns:1fr; } }
    .check-item { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:10px; padding:10px 12px; transition:all 0.15s; user-select:none; }
    .check-item:hover { border-color:rgba(0,155,180,0.4); background:rgba(0,155,180,0.06); }
    .check-item.selected { background:rgba(0,155,180,0.15); border-color:rgba(0,155,180,0.5); color:var(--white); }
    .check-box { width:18px; height:18px; border:2px solid rgba(255,255,255,0.2); border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
    .check-item.selected .check-box { background:var(--blue); border-color:var(--blue); }
    .check-box svg { display:none; width:11px; height:11px; }
    .check-item.selected .check-box svg { display:block; }
    .check-label { font-size:13px; font-weight:400; }
    .km-row { display:flex; gap:12px; align-items:flex-end; }
    .km-field { flex:1; }
    .km-field label { display:block; font-size:11px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--grey); margin-bottom:6px; }
    .km-field input { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:6px; color:var(--white); font-family:'SupremeLL',Arial,sans-serif; font-size:16px; font-weight:700; padding:11px 14px; width:100%; outline:none; transition:border-color 0.2s; }
    .km-field input:focus { border-color:var(--blue); }
    .notes-field { margin-top:14px; }
    .notes-field label { display:block; font-size:11px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--grey); margin-bottom:6px; }
    .notes-field textarea { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:6px; color:var(--white); font-family:'SupremeLL',Arial,sans-serif; font-size:14px; padding:11px 14px; width:100%; outline:none; resize:vertical; min-height:80px; transition:border-color 0.2s; }
    .notes-field textarea:focus { border-color:var(--blue); }
    .btn-submit { background:var(--green); border:none; border-radius:8px; color:#0a1a1f; cursor:pointer; font-family:'SupremeLL',Arial,sans-serif; font-size:15px; font-weight:700; letter-spacing:0.08em; padding:15px; text-transform:uppercase; width:100%; margin-top:24px; transition:opacity 0.2s; }
    .btn-submit:hover { opacity:0.88; }
    .btn-submit:disabled { opacity:0.4; cursor:not-allowed; }

    /* ── SUCCESS ── */
    .success-card { background:rgba(0,200,150,0.08); border:1px solid rgba(0,200,150,0.3); border-radius:10px; padding:28px 24px; text-align:center; margin-top:20px; }
    .success-icon { font-size:40px; margin-bottom:12px; }
    .success-title { font-size:20px; font-weight:700; color:var(--green); margin-bottom:8px; }
    .success-sub { font-size:14px; color:var(--grey); margin-bottom:20px; }
    .btn-new { background:var(--blue); border:none; border-radius:6px; color:white; cursor:pointer; font-family:'SupremeLL',Arial,sans-serif; font-size:14px; font-weight:700; letter-spacing:0.06em; padding:12px 24px; text-transform:uppercase; transition:background 0.2s; }
    .btn-new:hover { background:var(--blue-dark); }

    /* ── TOAST ── */
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--dark2); border:1px solid rgba(255,255,255,0.15); border-radius:8px; color:var(--white); font-size:14px; padding:12px 20px; z-index:999; opacity:0; transition:opacity 0.3s; pointer-events:none; white-space:nowrap; }
    .toast.show { opacity:1; }
    .toast.error { border-color:rgba(229,0,82,0.5); color:#ff6b9d; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="login-brand">Motowarehouse</div>
    <div class="login-title">Partner Portal</div>
    <div class="login-sub">Log in with your workshop credentials</div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="login-username" autocomplete="username" autocapitalize="none">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-primary" onclick="doLogin()" id="login-btn">Sign In</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="app-header">
    <div>
      <div class="app-brand">Motowarehouse</div>
      <div class="app-workshop" id="app-workshop-name">Partner Portal</div>
    </div>
    <button class="btn-logout" onclick="doLogout()">Sign Out</button>
  </div>

  <!-- STEP 1: Search -->
  <div class="step active" id="step-search">
    <div class="step-title">Log a Service Job</div>
    <div class="step-sub">Enter the vehicle's registration plate to get started.</div>
    <div class="plate-input-wrap">
      <input type="text" class="plate-input" id="plate-input" placeholder="e.g. AAA 123" maxlength="10"
        oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')searchVehicle()">
      <button class="btn-search" onclick="searchVehicle()">Search</button>
    </div>
    <div class="error-msg" id="search-error" style="margin-top:14px;"></div>
  </div>

  <!-- STEP 2: Log job -->
  <div class="step" id="step-log">
    <!-- Vehicle card -->
    <div class="vehicle-card" id="vehicle-card"></div>

    <!-- KM -->
    <div class="section-title">Current Kilometre Reading</div>
    <div class="km-row">
      <div class="km-field">
        <label>KM Reading *</label>
        <input type="number" id="km-input" placeholder="e.g. 12500" min="0">
      </div>
    </div>

    <!-- Checklist -->
    <div class="section-title">Work Carried Out *</div>
    <div class="checklist" id="checklist"></div>

    <!-- Notes -->
    <div class="notes-field">
      <label>Additional Notes / Parts Not Listed Above</label>
      <textarea id="notes-input" placeholder="e.g. Replaced rear shock absorber, topped up brake fluid..."></textarea>
    </div>

    <button class="btn-submit" id="submit-btn" onclick="submitEntry()">Submit Service Record</button>
  </div>

  <!-- STEP 3: Success -->
  <div class="step" id="step-success">
    <div class="success-card">
      <div class="success-icon">✓</div>
      <div class="success-title">Service Record Saved</div>
      <div class="success-sub" id="success-sub">The job has been logged successfully.</div>
      <button class="btn-new" onclick="startNew()">Log Another Vehicle</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let currentVehicle = null;
  let serviceItems = [];

  // ── AUTH ──────────────────────────────────────────────────────────────────
  async function checkAuth() {
    try {
      const res = await fetch('/api/partner/me');
      if (res.ok) {
        const data = await res.json();
        showApp(data.partner.workshopName);
      }
    } catch(e) {}
  }

  async function doLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-error');
    if (!username || !password) { showLoginError('Please enter username and password.'); return; }
    btn.disabled = true; btn.textContent = 'Signing in…';
    err.style.display = 'none';
    try {
      const res = await fetch('/api/partner/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (res.ok) {
        showApp(data.workshopName);
      } else {
        showLoginError(data.error || 'Login failed.');
      }
    } catch(e) {
      showLoginError('Connection error. Please try again.');
    }
    btn.disabled = false; btn.textContent = 'Sign In';
  }

  async function doLogout() {
    await fetch('/api/partner/logout', { method:'POST' });
    location.reload();
  }

  function showLoginError(msg) {
    const el = document.getElementById('login-error');
    el.textContent = msg; el.style.display = 'block';
  }

  async function showApp(workshopName) {
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('app-workshop-name').textContent = workshopName;
    await loadServiceItems();
    setStep('search');
  }

  // ── SERVICE ITEMS ────────────────────────────────────────────────────────
  async function loadServiceItems() {
    try {
      const res = await fetch('/api/service-items');
      serviceItems = await res.json();
    } catch(e) {
      serviceItems = ['Oil Change','Oil Filter','Air Filter','Spark Plug(s)','Front Tyre','Rear Tyre','Front Brake Pads','Rear Brake Pads','Chain & Sprocket Kit','Battery','Small Service','Big Service'];
    }
    renderChecklist();
  }

  function renderChecklist() {
    const el = document.getElementById('checklist');
    el.innerHTML = serviceItems.map(item => `
      <div class="check-item" onclick="toggleItem(this)" data-item="${item}">
        <div class="check-box">
          <svg viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="2,6 5,9 10,3"/>
          </svg>
        </div>
        <span class="check-label">${item}</span>
      </div>`).join('');
  }

  function toggleItem(el) {
    el.classList.toggle('selected');
  }

  function getSelectedItems() {
    return [...document.querySelectorAll('.check-item.selected')].map(el => el.dataset.item);
  }

  function clearChecklist() {
    document.querySelectorAll('.check-item').forEach(el => el.classList.remove('selected'));
  }

  // ── VEHICLE SEARCH ───────────────────────────────────────────────────────
  async function searchVehicle() {
    const plate = document.getElementById('plate-input').value.trim().toUpperCase().replace(/\s/g,'');
    const errEl = document.getElementById('search-error');
    errEl.style.display = 'none';
    if (!plate) { errEl.textContent = 'Please enter a plate number.'; errEl.style.display = 'block'; return; }

    try {
      const res = await fetch(`/api/vehicle?plate=${encodeURIComponent(plate)}`);
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || 'Vehicle not found.'; errEl.style.display = 'block'; return; }
      currentVehicle = data;
      renderVehicleCard(data);
      document.getElementById('km-input').value = '';
      clearChecklist();
      document.getElementById('notes-input').value = '';
      setStep('log');
    } catch(e) {
      errEl.textContent = 'Connection error. Please try again.'; errEl.style.display = 'block';
    }
  }

  function renderVehicleCard(v) {
    document.getElementById('vehicle-card').innerHTML = `
      <div class="vehicle-plate">${v.regNo}</div>
      <div class="vehicle-details">
        <div class="vehicle-detail"><span>Model</span>${v.model || '—'}</div>
        <div class="vehicle-detail"><span>Year</span>${v.year || '—'}</div>
        <div class="vehicle-detail"><span>Frame No.</span>${v.frameNo || '—'}</div>
        <div class="vehicle-detail"><span>Engine No.</span>${v.engineNo || '—'}</div>
      </div>
      <button class="btn-change" onclick="setStep('search')">← Search a different vehicle</button>`;
  }

  // ── SUBMIT ───────────────────────────────────────────────────────────────
  async function submitEntry() {
    const km = document.getElementById('km-input').value.trim();
    const items = getSelectedItems();
    const notes = document.getElementById('notes-input').value.trim();
    const btn = document.getElementById('submit-btn');

    if (!km || isNaN(km) || parseInt(km) <= 0) { showToast('Please enter a valid KM reading.', 'error'); return; }
    if (items.length === 0 && !notes) { showToast('Please select at least one service item or add notes.', 'error'); return; }

    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const res = await fetch('/api/service-entry', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ regNo: currentVehicle.regNo, km: parseInt(km), items, notes })
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById('success-sub').textContent =
          `Service record saved for ${currentVehicle.regNo} at ${parseInt(km).toLocaleString()} km.`;
        setStep('success');
      } else {
        showToast(data.error || 'Failed to save. Please try again.', 'error');
      }
    } catch(e) {
      showToast('Connection error. Please try again.', 'error');
    }
    btn.disabled = false; btn.textContent = 'Submit Service Record';
  }

  function startNew() {
    currentVehicle = null;
    document.getElementById('plate-input').value = '';
    document.getElementById('search-error').style.display = 'none';
    setStep('search');
  }

  // ── UTILS ────────────────────────────────────────────────────────────────
  function setStep(name) {
    document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
    document.getElementById('step-' + name).classList.add('active');
  }

  let toastTimer;
  function showToast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.className = 'toast show' + (type === 'error' ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
  }

  checkAuth();
</script>
</body>
</html>
