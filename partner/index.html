<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Portal – Motowarehouse</title>
  <style>
    @font-face { font-family:'SupremeLL'; src:url('/fonts/SupremeLLTT-Light.ttf'); font-weight:300; }
    @font-face { font-family:'SupremeLL'; src:url('/fonts/SupremeLLTT-Regular.ttf'); font-weight:400; }
    @font-face { font-family:'SupremeLL'; src:url('/fonts/SupremeLLTT-Medium.ttf'); font-weight:500; }
    @font-face { font-family:'SupremeLL'; src:url('/fonts/SupremeLLTT-Bold.ttf'); font-weight:700; }
    @font-face { font-family:'SupremeLL'; src:url('/fonts/SupremeLLTT-Black.ttf'); font-weight:900; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #009BB4;
      --blue-dark: #007a8f;
      --teal-light: #00EFD1;
      --dark: #001A21;
      --dark2: #002329;
      --dark3: #002D35;
      --dark4: #003E47;
      --teal-mid: #007D8E;
      --grey: #8a9ba0;
      --white: #ffffff;
      --red: #E50052;
      --green: #00c896;
      --orange: #E59000;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(0,155,180,0.18);
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'SupremeLL', Arial, sans-serif;
      background: var(--dark);
      color: var(--white);
      min-height: 100vh;
      font-weight: 300;
    }

    /* ── HEADER ── */
    header {
      background: var(--dark2);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-mark { height: 44px; width: auto; border-radius: 6px; object-fit: contain; display: block; }
    .logo-wrap { display: flex; align-items: center; gap: 12px; }
    .logo-text { font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--white); }
    .logo-sub  { font-size: 9px; font-weight: 400; letter-spacing: 0.1em; color: var(--blue); text-transform: uppercase; margin-top: 1px; }

    /* Header right */
    .header-right { display: flex; align-items: center; gap: 12px; }
    .workshop-name { font-size: 12px; color: var(--grey); }

    /* Language toggle */
    .lang-toggle {
      display: flex;
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .lang-btn {
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--grey);
      font-family: inherit;
      transition: all 0.15s;
    }
    .lang-btn.active {
      background: var(--blue);
      color: var(--dark);
    }

    .btn-signout {
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: var(--grey);
      font-size: 11px;
      padding: 5px 12px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.06em;
      transition: all 0.15s;
    }
    .btn-signout:hover { color: var(--white); border-color: rgba(255,255,255,0.3); }

    /* ── PAGE WRAPPER ── */
    .page-wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    /* ── SECTIONS ── */
    .section { display: none; }
    .section.active { display: block; }

    /* ── CARD ── */
    .card {
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
      margin-bottom: 16px;
    }
    @media (max-width: 500px) { .card { padding: 20px 16px; } }

    .card-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 20px;
    }

    /* ── INPUTS ── */
    label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--grey);
      margin-bottom: 6px;
    }

    input[type="text"], input[type="password"], input[type="number"], input[type="date"], textarea, select {
      width: 100%;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: var(--white);
      font-family: 'SupremeLL', Arial, sans-serif;
      font-size: 15px;
      font-weight: 400;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      margin-bottom: 16px;
    }
    input[type="date"] {
      color-scheme: light;
      background: #ffffff !important;
      color: #0a1a1f !important;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--blue);
      background: rgba(0,155,180,0.06);
      box-shadow: 0 0 0 3px rgba(0,155,180,0.12);
    }
    select option { background: #002329; color: var(--white); }
    textarea { resize: vertical; min-height: 80px; }

    /* ── BUTTONS ── */
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: 'SupremeLL', Arial, sans-serif;
      transition: all 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary   { background: var(--blue); color: #ffffff; }
    .btn-secondary { background: transparent; color: var(--grey); border: 1px solid rgba(255,255,255,0.1); margin-top: 10px; }
    .btn-warranty  { background: rgba(229,144,0,0.15); color: var(--orange); border: 1px solid rgba(229,144,0,0.35); margin-top: 10px; }

    /* ── MESSAGES ── */
    .msg { font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .msg.error   { background: rgba(229,0,82,0.12); color: #ff6b6b; border: 1px solid rgba(229,0,82,0.3); display: block; }
    .msg.success { background: rgba(0,200,150,0.1); color: var(--green); border: 1px solid rgba(0,200,150,0.3); display: block; }

    /* ── VEHICLE CARD ── */
    .vehicle-card {
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .vehicle-reg   { font-size: 22px; font-weight: 900; letter-spacing: 0.08em; color: var(--blue); margin-bottom: 4px; }
    .vehicle-model { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
    .vehicle-meta  { display: flex; gap: 8px; flex-wrap: wrap; }
    .vehicle-tag   { font-size: 11px; color: var(--grey); background: rgba(255,255,255,0.05); padding: 3px 9px; border-radius: 4px; }

    /* ── PLATE SEARCH ── */
    .plate-wrap { position: relative; }
    .plate-wrap input {
      text-transform: uppercase;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding-right: 90px;
      margin-bottom: 0;
    }
    .plate-search-btn {
      position: absolute;
      right: 10px; top: 50%;
      transform: translateY(-50%);
      background: var(--blue);
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      color: var(--dark);
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.06em;
    }

    /* ── TABS ── */
    .tab-bar {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .tab-btn {
      padding: 10px 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--grey);
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.15s;
    }
    .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* ── CONFIRM MODAL ── */
    .confirm-overlay {
      position:fixed; inset:0; z-index:9000;
      background:rgba(0,0,0,0.7); backdrop-filter:blur(4px);
      display:flex; align-items:center; justify-content:center;
      padding:20px; display:none;
    }
    .confirm-overlay.show { display:flex; }
    .confirm-modal {
      background:#0f2429; border:1px solid rgba(0,155,180,0.25);
      border-radius:16px; padding:32px; max-width:420px; width:100%;
    }
    .confirm-modal h3 { font-size:17px; font-weight:700; margin-bottom:8px; }
    .confirm-modal p  { color:var(--grey); font-size:14px; margin-bottom:24px; line-height:1.5; }
    .confirm-modal .btn-row { display:flex; gap:12px; }
    .confirm-modal .btn-row .btn { flex:1; padding:13px; font-size:14px; }
    .btn-confirm { background:var(--blue)!important; color:#fff!important; }
    .btn-cancel-modal { background:transparent!important; color:var(--grey)!important;
      border:1px solid rgba(255,255,255,0.12)!important; }

    /* ── MY CLAIMS ── */
    .claims-list { display:flex; flex-direction:column; gap:12px; }
    .claim-card {
      background:#0a1a1f; border:1px solid rgba(0,155,180,0.15);
      border-radius:10px; padding:16px;
    }
    .claim-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .claim-status {
      font-size:11px; font-weight:700; letter-spacing:0.07em;
      text-transform:uppercase; padding:3px 10px; border-radius:12px;
    }
    .claim-st-open     { background:rgba(0,155,180,0.15);  color:#009BB4; }
    .claim-st-approved { background:rgba(0,200,150,0.15);  color:#00c896; }
    .claim-st-rejected { background:rgba(229,0,82,0.15);   color:#E50052; }
    .claim-st-closed   { background:rgba(120,120,120,0.15);color:#999; }
    .claim-reg  { font-size:18px; font-weight:700; }
    .claim-sym  { font-size:13px; color:var(--grey); margin-top:4px; }
    .claim-note { margin-top:10px; padding:10px 12px; background:rgba(0,155,180,0.06);
      border-radius:6px; font-size:13px; color:var(--grey); }

    /* ── PARTNER HELP ── */
    .p-help-section { margin-bottom: 24px; }
    .p-help-title { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--blue); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(0,155,180,0.15); }
    .p-help-block { margin-bottom: 14px; }
    .p-help-q { font-size: 14px; font-weight: 700; color: var(--white); margin-bottom: 5px; }
    .p-help-block p { font-size: 13px; color: var(--grey); line-height: 1.65; }

    /* ── YES/NO QUESTIONS ── */
    .yn-group { margin-bottom: 18px; }
    .yn-label { font-size: 13px; font-weight: 500; color: var(--white); margin-bottom: 10px; line-height: 1.4; }
    .yn-options { display: flex; gap: 10px; }
    .yn-option {
      flex: 1;
      padding: 9px 12px;
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      color: var(--grey);
      background: var(--surface);
      transition: all 0.15s;
      user-select: none;
    }
    .yn-option:hover { border-color: rgba(0,155,180,0.4); color: var(--white); }
    .yn-option.selected-yes { border-color: var(--green); background: rgba(0,200,150,0.1); color: var(--green); }
    .yn-option.selected-no  { border-color: rgba(229,0,82,0.5); background: rgba(229,0,82,0.08); color: var(--red); }

    /* ── SERVICE CHECKLIST TABLE ── */
    /* ── CHIP CHECKLIST ── */
    .checklist-groups { display: flex; flex-direction: column; gap: 20px; }
    .cg-title {
      font-size: 10px; font-weight: 700; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--blue); opacity: 0.75;
      margin-bottom: 8px; padding-bottom: 5px;
      border-bottom: 1px solid rgba(0,155,180,0.15);
    }
    .cg-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .check-chip {
      display: inline-flex; flex-direction: column; align-items: flex-start;
      padding: 10px 14px; border-radius: 8px;
      border: 1.5px solid rgba(0,155,180,0.22);
      background: rgba(255,255,255,0.03);
      cursor: pointer; transition: all 0.13s;
      font-family: inherit; user-select: none;
      min-width: 110px; text-align: left;
    }
    .check-chip:active { transform: scale(0.96); }
    .check-chip .cc-name { font-size: 13px; font-weight: 700; letter-spacing: 0.03em; color: var(--white); line-height: 1.2; }
    .check-chip .cc-sub  { font-size: 10px; color: var(--grey); margin-top: 2px; }
    .check-chip .cc-badge {
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
      margin-top: 7px; padding: 2px 7px; border-radius: 4px;
      display: none;
    }
    /* OK state */

    /* Replaced state */
    .check-chip.s-rep { border-color: var(--orange); background: rgba(229,144,0,0.1); }
    .check-chip.s-rep .cc-badge { display: inline-block; background: rgba(229,144,0,0.2); color: var(--orange); }
    /* N/A state */
    .check-chip.s-soon { border-color: #E5B800; background: rgba(229,184,0,0.08); }
    .check-chip.s-soon .cc-badge { display: inline-block; background: rgba(229,184,0,0.18); color: #E5B800; }

    /* ── SUCCESS SCREEN ── */
    .success-screen { text-align: center; padding: 16px 0; }
    .success-icon {
      width: 60px; height: 60px;
      background: rgba(0,200,150,0.12);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    .success-icon svg { width: 30px; height: 30px; stroke: var(--green); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .success-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .success-sub   { font-size: 13px; color: var(--grey); margin-bottom: 24px; }

    /* ── DIVIDER ── */
    .form-divider { border: none; border-top: 1px solid rgba(255,255,255,0.07); margin: 20px 0; }

    /* ── LOGIN SCREEN ── */
    .login-wrap { max-width: 400px; margin: 0 auto; padding-top: 20px; }
    .login-title { font-size: 22px; font-weight: 900; letter-spacing: -0.01em; text-align: center; margin-bottom: 28px; }
    .login-title span { color: var(--blue); }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="logo-wrap">
    <img src="/assets/MWH_Logo_New.png" alt="Motowarehouse" class="logo-mark"
         onerror="this.style.display='none'">
    <div>
      <div class="logo-text">Motowarehouse</div>
      <div class="logo-sub">Partner Portal</div>
    </div>
  </div>
  <div class="header-right" id="header-right">
    <div class="lang-toggle">
      <button class="lang-btn active" id="lang-el" onclick="setLang('el')">GR</button>
      <button class="lang-btn" id="lang-en" onclick="setLang('en')">EN</button>
    </div>
    <span class="workshop-name" id="workshop-display" style="display:none;"></span>
    <button class="btn-signout" id="signout-btn" onclick="doLogout()" style="display:none;">
      <span data-gr="Αποσύνδεση" data-en="Sign out"></span>
    </button>
  </div>
</header>

<!-- ── LOGIN SECTION ── -->
<div class="section active" id="section-login">
  <div class="page-wrap">
    <div class="login-wrap">
      <div class="login-title"><span data-gr="Είσοδος" data-en="Sign In"></span></div>
      <div class="card">
        <div class="card-title"><span data-gr="Σύνδεση Συνεργείου" data-en="Workshop Login"></span></div>
        <div id="login-msg" class="msg"></div>
        <label><span data-gr="Όνομα Χρήστη" data-en="Username"></span></label>
        <input type="text" id="login-username" autocomplete="username"
          onkeydown="if(event.key==='Enter') document.getElementById('login-password').focus()">
        <label><span data-gr="Κωδικός" data-en="Password"></span></label>
        <input type="password" id="login-password" autocomplete="current-password"
          onkeydown="if(event.key==='Enter') doLogin()">
        <button class="btn btn-primary" onclick="doLogin()">
          <span data-gr="Είσοδος" data-en="Sign In"></span>
        </button>
      </div>

      <!-- CHANGE PASSWORD (only visible on login screen) -->
      <div style="margin-top:20px;">
        <button onclick="toggleChangePassword()" style="background:none;border:none;color:var(--grey);font-family:inherit;font-size:12px;font-weight:600;letter-spacing:0.07em;cursor:pointer;text-decoration:underline;padding:0;">
          🔑 <span data-gr="Αλλαγή Κωδικού" data-en="Change Password"></span>
        </button>
        <div id="cp-panel" style="display:none;margin-top:14px;background:rgba(0,155,180,0.05);border:1px solid rgba(0,155,180,0.15);border-radius:10px;padding:20px;">
          <div style="font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--blue);margin-bottom:14px;">
            <span data-gr="Αλλαγή Κωδικού" data-en="Change Password"></span>
          </div>
          <label style="display:block;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--grey);margin-bottom:5px;">
            <span data-gr="Όνομα Χρήστη" data-en="Username"></span>
          </label>
          <input type="text" id="cp-username" class="input-field" style="margin-bottom:10px;" placeholder="username">
          <label style="display:block;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--grey);margin-bottom:5px;">
            <span data-gr="Τρέχων Κωδικός" data-en="Current Password"></span>
          </label>
          <input type="password" id="cp-current" class="input-field" style="margin-bottom:10px;" placeholder="Current password">
          <label style="display:block;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--grey);margin-bottom:5px;">
            <span data-gr="Νέος Κωδικός" data-en="New Password"></span>
          </label>
          <input type="password" id="cp-new" class="input-field" style="margin-bottom:10px;" placeholder="New password (min 6)">
          <label style="display:block;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--grey);margin-bottom:5px;">
            <span data-gr="Επιβεβαίωση" data-en="Confirm New Password"></span>
          </label>
          <input type="password" id="cp-confirm" class="input-field" style="margin-bottom:12px;" placeholder="Repeat new password">
          <div id="cp-msg" style="display:none;font-size:13px;margin-bottom:10px;"></div>
          <button onclick="changePassword()" style="background:var(--blue);border:none;border-radius:6px;color:white;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:0.06em;padding:10px 24px;width:100%;">
            <span data-gr="Αποθήκευση Νέου Κωδικού" data-en="Save New Password"></span>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ── MAIN SECTION ── -->
<div class="section" id="section-main">
  <div class="page-wrap">

    <!-- STEP 1: Search -->
    <div id="step-search">
      <div class="card">
        <div class="card-title">
          <span data-gr="Αναζήτηση Οχήματος" data-en="Find Vehicle"></span>
        </div>
        <div id="search-msg" class="msg"></div>
        <label><span data-gr="Αριθμός Κυκλοφορίας" data-en="Registration Plate"></span></label>
        <div class="plate-wrap">
          <input type="text" id="plate-input"
            placeholder="π.χ. ABC 123"
            maxlength="12"
            oninput="this.value=this.value.toUpperCase()"
            onkeydown="if(event.key==='Enter') searchVehicle()">
          <button class="plate-search-btn" onclick="searchVehicle()">
            <span data-gr="Αναζήτηση" data-en="Search"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- STEP 2+: Log work or file warranty -->
    <div id="step-log" style="display:none;">

      <!-- Vehicle found card -->
      <div class="card" id="vehicle-found-card">
        <div class="card-title"><span data-gr="Όχημα" data-en="Vehicle"></span></div>
        <div id="vehicle-result"></div>
      </div>

      <!-- TABS -->
      <div class="tab-bar">
        <button class="tab-btn active" id="tab-service-btn" onclick="switchTab('service')">
          <span data-gr="Εργασία Σέρβις" data-en="Service Work"></span>
        </button>
        <button class="tab-btn" id="tab-warranty-btn" onclick="switchTab('warranty')">
          <span data-gr="Εγγύηση" data-en="Warranty Claim"></span>
        </button>
        <button class="tab-btn" id="tab-claims-btn" onclick="switchTab('claims')">
          <span data-gr="Οι Δηλώσεις μου" data-en="My Claims"></span>
        </button>
        <button class="tab-btn" id="tab-help-btn" onclick="switchTab('help')">
          <span data-gr="Οδηγίες" data-en="Help"></span>
        </button>
      </div>

      <!-- ─── SERVICE TAB ─── -->
      <div class="tab-pane active" id="tab-service">
        <div class="card">
          <div class="card-title" style="font-size:16px;"><span data-gr="Καταχώρηση Εργασίας" data-en="Log Service Entry"></span></div>
          <div id="log-msg" class="msg"></div>

          <!-- Section 1: Basic Info -->
          <div style="margin-bottom:20px;">

<script>
  // ── DATA ─────────────────────────────────────────────────────────────────────
  const SERVICE_ITEMS = [
    { en: 'ENGINE OIL',       el: 'ΛΑΔΙ ΜΗΧΑΝΗΣ' },
    { en: 'GEAR OIL',         el: 'ΛΑΔΙ ΣΥΜΠΛΕΚΤΗ' },
    { en: 'SPARK PLUG',       el: 'ΜΠΟΥΖΙ' },
    { en: 'SPARK PLUG CAP',   el: 'ΚΑΠΑΚΙ ΜΠΟΥΖΙ' },
    { en: 'CHAIN',            el: 'ΑΛΥΣΙΔΑ ΚΙΝΗΣΗΣ' },
    { en: 'DRIVE SPROCKET',   el: 'ΓΡΑΝΑΖΙ ΚΙΝΗΣΗΣ' },
    { en: 'REAR SPROCKET',    el: 'ΓΡΑΝΑΖΙ ΟΠΙΣΘΙΟΥ ΤΡΟΧΟΥ' },
    { en: 'CHECK VALVES',     el: 'ΕΛΕΓΧΟΣ ΔΙΑΚΕΝΩΝ ΒΑΛΒΙΔΩΝ' },
    { en: 'AIR FILTER',       el: 'ΦΙΛΤΡΟ ΑΕΡΟΣ' },
    { en: 'OIL FILTER',       el: 'ΦΙΛΤΡΟ ΛΑΔΙΟΥ' },
    { en: 'FRONT BRAKE PADS', el: 'ΤΑΚΑΚΙΑ ΜΠΡΟΣΤΑ' },
    { en: 'REAR BRAKE PADS',  el: 'ΤΑΚΑΚΙΑ ΠΙΣΩ' },
    { en: 'BELT',             el: 'ΙΜΑΝΤΑΣ ΚΙΝΗΣΗΣ' },
    { en: 'ROLLERS',          el: 'ΜΠΙΛΙΕΣ ΦΥΓΟΚΕΝΤΡΙΚΟΥ' },
    { en: 'SLIDERS',          el: 'ΦΩΛΙΕΣ ΦΥΓΟΚΕΝΤΡΙΚΟΥ' },
    { en: 'CLUTCH',           el: 'ΣΥΜΠΛΕΚΤΗΣ' },
    { en: 'DRIVE FACE',       el: 'DRIVE FACE' },
    { en: 'MOVABLE DRIVE',    el: 'MOVABLE DRIVE' },
    { en: 'FTEROTI',          el: 'ΦΤΕΡΩΤΗ' },
    { en: 'VARIATOR',         el: 'ΒΑΡΙΑΤΟΡ' },
    { en: 'FRONT LAMP',       el: 'ΛΑΜΠΑ ΕΜΠΡΟΣΘΙΟΥ ΦΑΝΟΥ' },
    { en: 'REAR LAMP',        el: 'ΛΑΜΠΑ ΟΠΙΣΘΙΟΥ ΦΑΝΟΥ' },
    { en: 'FRONT TYRE',       el: 'ΕΛΑΣΤΙΚΟ ΜΠΡΟΣΤΑ' },
    { en: 'REAR TYRE',        el: 'ΕΛΑΣΤΙΚΟ ΠΙΣΩ' }
  ];

  // ── STATE ─────────────────────────────────────────────────────────────────────
  let currentLang  = 'el';
  let currentPlate = '';
  const ynAnswers  = {}; // { oil: 'yes', noise: 'no', ... }
  // itemStates[i] = 'ok' | 'replace' | 'na' | null
  const itemStates = new Array(SERVICE_ITEMS.length).fill(null);

  // ── SERVER DATE ──────────────────────────────────────────────────────────────
  // Always fetch the server's date — never use the client's clock.
  // This prevents partners from manipulating the service date by changing their PC time.
  async function setServerDate() {
    try {
      const r = await fetch('/api/server-time');
      const d = await r.json();
      document.getElementById('log-date').value = d.date;
      document.getElementById('log-date-display').textContent = d.displayDate;
    } catch {
      // Fallback to client date only if server is unreachable (shouldn't happen in practice)
      const fb = new Date();
      document.getElementById('log-date').value = fb.toISOString().split('T')[0];
      document.getElementById('log-date-display').textContent = fb.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }
  }

  // ── LANGUAGE ─────────────────────────────────────────────────────────────────
  function setLang(lang) {
    currentLang = lang;
    document.getElementById('lang-el').classList.toggle('active', lang === 'el');
    document.getElementById('lang-en').classList.toggle('active', lang === 'en');
    document.documentElement.lang = lang;
    // Update all translatable spans
    document.querySelectorAll('[data-gr]').forEach(el => {
      el.textContent = lang === 'el' ? el.dataset.gr : el.dataset.en;
    });
    // Update input placeholders
    if (lang === 'el') {
      const p = document.getElementById('plate-input');
      if (p) p.placeholder = 'π.χ. ABC 123';
    } else {
      const p = document.getElementById('plate-input');

  async function changePassword() {
    const username = document.getElementById('cp-username').value.trim();
    const current  = document.getElementById('cp-current').value;
    const newPw    = document.getElementById('cp-new').value;
    const confirm  = document.getElementById('cp-confirm').value;
    const msg      = document.getElementById('cp-msg');
    msg.style.display = 'none';
    if (!username || !current || !newPw || !confirm) { msg.style.color='var(--red)'; msg.textContent='All fields are required.'; msg.style.display='block'; return; }
    if (newPw.length < 6) { msg.style.color='var(--red)'; msg.textContent='New password must be at least 6 characters.'; msg.style.display='block'; return; }
    if (newPw !== confirm) { msg.style.color='var(--red)'; msg.textContent='New passwords do not match.'; msg.style.display='block'; return; }
    try {
      const res  = await fetch('/api/partner/change-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, currentPassword: current, newPassword: newPw })
      });
      const data = await res.json();
      if (res.ok) {
        msg.style.color = 'var(--green)'; msg.textContent = '✓ Password changed successfully!'; msg.style.display = 'block';
        document.getElementById('cp-username').value = '';
        document.getElementById('cp-current').value = '';
        document.getElementById('cp-new').value = '';
        document.getElementById('cp-confirm').value = '';
      } else {
        msg.style.color = 'var(--red)'; msg.textContent = data.error || 'Failed to change password.'; msg.style.display = 'block';
      }
    } catch(e) { msg.style.color='var(--red)'; msg.textContent='Connection error.'; msg.style.display='block'; }
  }

  // ── MY WARRANTY CLAIMS ────────────────────────────────────────────────────
  const STATUS_LABELS_CLAIMS = {
    en: { open: 'Open', approved: 'Approved', rejected: 'Rejected', closed: 'Closed' },
    el: { open: 'Ανοιχτή', approved: 'Εγκρίθηκε', rejected: 'Απορρίφθηκε', closed: 'Κλειστή' }
  };
  const CLAIM_ST_CLASS = { open:'claim-st-open', approved:'claim-st-approved', rejected:'claim-st-rejected', closed:'claim-st-closed' };
  const PRIORITY_LABELS = { en:{ normal:'Normal', high:'High', urgent:'Urgent' }, el:{ normal:'Κανονική', high:'Υψηλή', urgent:'Επείγουσα' } };

  async function loadMyClaims() {
    const loading = document.getElementById('claims-loading');
    const empty   = document.getElementById('claims-empty');
    const list    = document.getElementById('claims-list');
    loading.style.display = 'block';
    empty.style.display   = 'none';
    list.innerHTML        = '';

    try {
      const res  = await fetch('/api/partner/warranties');
      if (!res.ok) throw new Error('Failed');
      const claims = await res.json();
      loading.style.display = 'none';

      if (!claims.length) {
        empty.style.display = 'block';
        return;
      }

      const lang = currentLang || 'el';
      list.innerHTML = claims.map(c => {
        const statusLabel = (STATUS_LABELS_CLAIMS[lang] || STATUS_LABELS_CLAIMS.en)[c.status] || c.status;
        const stClass     = CLAIM_ST_CLASS[c.status] || 'claim-st-open';
        const priLabel    = (PRIORITY_LABELS[lang] || PRIORITY_LABELS.en)[c.priority] || c.priority || '';
        const date        = c.createdAt ? new Date(c.createdAt).toLocaleDateString('el-GR') : '—';
        return `
          <div class="claim-card">
            <div class="claim-card-header">
              <span class="claim-reg">${c.regNo}</span>
              <span class="claim-status ${stClass}">${statusLabel}</span>
            </div>
            <div class="claim-sym">${lang === 'el' ? 'Βλάβη' : 'Fault'}: ${c.symptom || '—'}</div>
            <div class="claim-sym">${lang === 'el' ? 'Προτεραιότητα' : 'Priority'}: ${priLabel} &nbsp;·&nbsp; ${lang === 'el' ? 'Υποβλήθηκε' : 'Submitted'}: ${date}</div>
            ${c.adminNotes ? `<div class="claim-note">
              <strong>${lang === 'el' ? 'Σημειώσεις Motowarehouse:' : 'Motowarehouse Notes:'}</strong><br>${c.adminNotes}
            </div>` : ''}
          </div>
        `;
      }).join('');
    } catch(e) {
      loading.style.display = 'none';
      list.innerHTML = `<p style="color:#ff6b6b;font-size:14px;">${currentLang === 'el' ? 'Σφάλμα φόρτωσης.' : 'Failed to load claims.'}</p>`;
    }
  }

  // ── CHECKLIST GROUPS ─────────────────────────────────────────────────────
  const SERVICE_GROUPS = [
    { en: 'ENGINE',              el: 'ΚΙΝΗΤΗΡΑΣ',        idx: [0,1,2,3,7,8,9] },
    { en: 'DRIVE & TRANSMISSION',el: 'ΜΕΤΑΔΟΣΗ',         idx: [4,5,6,12,13,14,15,16,17,18,19] },
    { en: 'BRAKES',              el: 'ΦΡΕΝΑ',             idx: [10,11] },
    { en: 'LIGHTS',              el: 'ΦΩΤΑ',              idx: [20,21] },
    { en: 'TYRES',               el: 'ΕΛΑΣΤΙΚΑ',          idx: [22,23] },
  ];

  const CHIP_CYCLE  = [null, 'replace', 'soon'];
  const BADGE_LABEL = {
    el: { replace: '↺ ΑΛΛΑΧΘΗΚΕ', soon: '⚑ ΣΥΝΤΟΜΑ' },
    en: { replace: '↺ CHANGED',   soon: '⚑ CHECK SOON' }
  };

  function buildChecklist() {
    const container = document.getElementById('checklist-container');
    if (!container) return;
    container.innerHTML = '';
    SERVICE_GROUPS.forEach(group => {
      const groupDiv = document.createElement('div');
      const title = currentLang === 'el' ? group.el : group.en;
      const chips = group.idx.map(i => {
        const item    = SERVICE_ITEMS[i];
        const primary = currentLang === 'el' ? item.el : item.en;
        const sub     = currentLang === 'el' ? item.en : item.el;
        const state   = itemStates[i];
        const cls     = state ? 's-' + (state === 'replace' ? 'rep' : state) : '';
        const badge   = state ? BADGE_LABEL[currentLang][state] : '';
        return `<button class="check-chip ${cls}" onclick="cycleItemState(${i}, this)">
          <span class="cc-name">${primary}</span>
          <span class="cc-sub">${sub}</span>
          <span class="cc-badge">${badge}</span>
        </button>`;
      }).join('');
      groupDiv.innerHTML = `<div class="cg-title">${title}</div><div class="cg-chips">${chips}</div>`;
      container.appendChild(groupDiv);
    });
  }

  function cycleItemState(index, btn) {
    const cur     = itemStates[index];
    const nextIdx = (CHIP_CYCLE.indexOf(cur) + 1) % CHIP_CYCLE.length;
    const next    = CHIP_CYCLE[nextIdx];
    itemStates[index] = next;
    // Update chip in-place (no full rebuild, no scroll jump)
    btn.className = 'check-chip' + (next ? ' s-' + (next === 'replace' ? 'rep' : next) : '');
    const badge = btn.querySelector('.cc-badge');
    badge.textContent = next ? BADGE_LABEL[currentLang][next] : '';
  }

  // ── SUBMIT SERVICE LOG (with confirmation dialog) ────────────────────────
  let _pendingLogPayload = null; // stored while confirmation modal is open

  async function submitLog() {
    const km    = document.getElementById('log-km').value.trim();
    const notes = document.getElementById('log-notes').value.trim();
    const date  = document.getElementById('log-date').value;
    const msg   = document.getElementById('log-msg');

    if (!km || isNaN(km) || parseInt(km) <= 0) {
      showMsg(msg, currentLang === 'el' ? 'Εισάγετε έγκυρη ένδειξη χιλιομέτρων.' : 'Please enter a valid KM reading.', 'error');
      return;
    }

    // Build items list from states
    const items = [];
    itemStates.forEach((state, i) => {
      if (state === 'replace') items.push({ key: SERVICE_ITEMS[i].en, state: 'replaced', en: SERVICE_ITEMS[i].en, el: SERVICE_ITEMS[i].el });
      else if (state === 'soon') items.push({ key: SERVICE_ITEMS[i].en, state: 'soon', en: SERVICE_ITEMS[i].en, el: SERVICE_ITEMS[i].el });
    });

    // Append yn answers as notes prefix
    const ynText = formatYNAnswers();
    const finalNotes = ynText ? ynText + (notes ? '\n' + notes : '') : notes;

    if (!items.length && !finalNotes) {
      showMsg(msg, currentLang === 'el' ? 'Επιλέξτε τουλάχιστον ένα στοιχείο ή προσθέστε σημειώσεις.' : 'Please check at least one item or add notes.', 'error');
      return;
    }

    // Show confirmation dialog — don't save yet
    _pendingLogPayload = { regNo: currentPlate, km: parseInt(km), items, notes: finalNotes, date };
    const el = document.getElementById('confirm-overlay');
    const title = document.getElementById('confirm-title');
    const body  = document.getElementById('confirm-body');
    title.textContent = currentLang === 'el' ? 'Επιβεβαίωση Αποθήκευσης' : 'Confirm Save';
    body.textContent  = currentLang === 'el'
      ? `Είστε σίγουροι ότι όλες οι πληροφορίες είναι σωστές; Η καταχώρηση θα αποθηκευτεί μόνιμα στο ιστορικό σέρβις για ${currentPlate}.`
      : `Are you sure all information is correct? This entry will be permanently saved to the service history for ${currentPlate}.`;
    document.getElementById('confirm-ok-btn').querySelector('span').setAttribute('data-en', 'Save Entry');
    document.getElementById('confirm-ok-btn').querySelector('span').setAttribute('data-gr', 'Αποθήκευση');
    setLang(currentLang); // re-apply translations to modal
    el.classList.add('show');
  }

  function closeConfirm() {
    document.getElementById('confirm-overlay').classList.remove('show');
    _pendingLogPayload = null;
  }

  async function confirmAction() {
    if (!_pendingLogPayload) return;
    const payload = _pendingLogPayload;
    _pendingLogPayload = null;
    closeConfirm();

    const msg = document.getElementById('log-msg');
    const btn = document.querySelector('.btn-primary[onclick="submitLog()"]') ||
                document.querySelector('[onclick="submitLog()"]');
    if (btn) { btn.disabled = true; }

    try {
      const res = await fetch('/api/service-entry', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById('step-log').style.display    = 'none';
        document.getElementById('step-success').style.display = 'block';
        document.getElementById('success-detail').textContent = `${payload.regNo} · ${Number(payload.km).toLocaleString()} km`;
      } else {
        showMsg(msg, data.error || (currentLang === 'el' ? 'Αποτυχία αποθήκευσης.' : 'Failed to save.'), 'error');
      }
    } catch(e) {
      showMsg(msg, currentLang === 'el' ? 'Σφάλμα σύνδεσης.' : 'Connection error.', 'error');
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  function formatYNAnswers() {
    const labels = {
      el: {
        oil:   { q: 'Λάδι ανεφοδιάστηκε σε σωστό επίπεδο', yes: 'ΝΑΙ', no: 'ΟΧΙ' },
        noise: { q: 'Ασυνήθιστος θόρυβος κινητήρα', yes: 'ΝΑΙ', no: 'ΟΧΙ' }
      },
      en: {
        oil:   { q: 'Oil topped up correctly', yes: 'YES', no: 'NO' },
        noise: { q: 'Abnormal engine noise', yes: 'YES', no: 'NO' }
      }
    };
    const l = labels[currentLang] || labels.en;
    const parts = Object.keys(ynAnswers).filter(k => ['oil','noise'].includes(k)).map(k => {
      const v = ynAnswers[k];
      return `${l[k].q}: ${v === 'yes' ? l[k].yes : l[k].no}`;
    });
    return parts.length ? parts.join(' | ') : '';
  }

  // ── PHOTO HANDLING ────────────────────────────────────────────────────────
  let warrantyPhotos = [];

  const CLOUDINARY_CLOUD   = 'daczjjuel';
  const CLOUDINARY_PRESET  = 'vxscuzge';

  async function uploadToCloudinary(file) {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', CLOUDINARY_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/auto/upload`, {
      method: 'POST', body: fd
    });
    if (!res.ok) throw new Error('Cloudinary upload failed');
    const data = await res.json();
    return { url: data.secure_url, type: data.resource_type }; // 'image' or 'video'
  }

  async function handleWarrantyPhotos(input) {
    const files = Array.from(input.files).slice(0, 6 - warrantyPhotos.length);
    if (!files.length) return;
    const progress = document.getElementById('w-upload-progress');
    const label    = document.getElementById('w-upload-label');
    label.style.pointerEvents = 'none';
    label.style.opacity = '0.5';
    progress.style.display = 'block';

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      progress.textContent = currentLang === 'el'
        ? `Μεταφόρτωση ${i + 1} από ${files.length}…`
        : `Uploading ${i + 1} of ${files.length}…`;
      try {
        const { url, type } = await uploadToCloudinary(file);
        warrantyPhotos.push({ url, type });
        renderMediaPreview();
      } catch {
        progress.textContent = currentLang === 'el' ? 'Σφάλμα μεταφόρτωσης — δοκιμάστε ξανά.' : 'Upload failed — please try again.';
      }
    }

    progress.style.display = 'none';
    label.style.pointerEvents = '';
    label.style.opacity = '';
    input.value = '';
    if (warrantyPhotos.length >= 6) label.style.display = 'none';
  }

  function renderMediaPreview() {
    const preview = document.getElementById('w-photos-preview');
    preview.innerHTML = '';
    warrantyPhotos.forEach(({ url, type }, i) => {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:relative;width:90px;height:90px;border-radius:8px;overflow:hidden;border:1.5px solid rgba(229,144,0,0.35);background:#000;';
      if (type === 'video') {
        wrap.innerHTML = `<video src="${url}" style="width:100%;height:100%;object-fit:cover;" muted playsinline></video>
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
            <div style="width:28px;height:28px;background:rgba(0,0,0,0.6);border-radius:50%;display:flex;align-items:center;justify-content:center;">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </div>
          </div>`;
      } else {
        wrap.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;">`;
      }
      wrap.innerHTML += `<button onclick="removeMedia(${i})" style="position:absolute;top:3px;right:3px;background:rgba(0,0,0,0.75);border:none;border-radius:50%;color:white;cursor:pointer;font-size:11px;width:20px;height:20px;line-height:20px;text-align:center;padding:0;">✕</button>`;
      preview.appendChild(wrap);
    });
  }

  function removeMedia(idx) {
    warrantyPhotos.splice(idx, 1);
    renderMediaPreview();
    // Restore upload button if below limit
    if (warrantyPhotos.length < 6) document.getElementById('w-upload-label').style.display = '';
  }

  function removePhoto(idx) {
    removeMedia(idx);
  }

          courtesyVehicle:   ynAnswers['w-courtesy'] === 'yes',

      showMsg(msg, currentLang === 'el' ? 'Σφάλμα σύνδεσης.' : 'Connection error.', 'error');

  // ── HELPERS ────────────────────────────────────────────────────────────────
  function showMsg(el, text, type) { el.textContent = text; el.className = 'msg ' + type; }
  function clearMsg(el) { if (el) { el.textContent = ''; el.className = 'msg'; } }

  // ── INIT ──────────────────────────────────────────────────────────────────
  checkAuth();
  setLang('el'); // default Greek
</script>
</body>
</html>
