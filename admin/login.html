<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Motowarehouse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a0a;
      --surface: #141414;
      --border:  #1e1e1e;
      --blue:    #009bb4;
      --white:   #f0f0f0;
      --grey:    #6b7280;
      --red:     #e54b4b;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .wrap {
      width: 100%;
      max-width: 380px;
    }

    .logo {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-text {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--grey);
    }

    .logo-brand {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--white);
      margin-top: 4px;
    }

    .logo-brand span { color: var(--blue); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--grey);
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--grey);
      margin-bottom: 6px;
      margin-top: 16px;
    }

    label:first-of-type { margin-top: 0; }

    input[type="password"] {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--white);
      font-family: inherit;
      font-size: 15px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="password"]:focus { border-color: var(--blue); }

    .btn {
      display: block;
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      background: var(--blue);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .msg {
      font-size: 13px;
      font-weight: 500;
      padding: 10px 12px;
      border-radius: 7px;
      margin-bottom: 16px;
      display: none;
    }

    .msg.error   { background: rgba(229,75,75,0.12); color: var(--red); display: block; }
    .msg.success { background: rgba(0,155,180,0.12); color: var(--blue); display: block; }

    /* hCaptcha centering */
    .h-captcha { margin-top: 18px; display: flex; justify-content: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <div class="logo-text">Service Portal</div>
      <div class="logo-brand">Moto<span>warehouse</span></div>
    </div>

    <div class="card">
      <div class="card-title">Admin Login</div>

      <div id="msg" class="msg"></div>

      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password"
        onkeydown="if(event.key==='Enter') doLogin()">

      <div class="h-captcha" data-sitekey="eb84b046-39d0-4fd2-a1e2-28e02294d4ce" data-theme="dark"></div>

      <button class="btn" id="loginBtn" onclick="doLogin()">Sign In</button>
    </div>
  </div>

  <script>
    async function doLogin() {
      const password = document.getElementById('password').value;
      const msg      = document.getElementById('msg');
      const btn      = document.getElementById('loginBtn');

      msg.className = 'msg';
      msg.textContent = '';

      if (!password) {
        msg.className = 'msg error';
        msg.textContent = 'Please enter your password.';
        return;
      }

      // Get hCaptcha token
      const captchaToken = hcaptcha.getResponse();

      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password, 'h-captcha-response': captchaToken })
        });
        const data = await res.json();

        if (res.ok) {
          msg.className = 'msg success';
          msg.textContent = 'Authenticated. Loading panel…';
          window.location.href = '/mw-service-solonas';
        } else {
          msg.className = 'msg error';
          msg.textContent = data.error || 'Login failed. Please try again.';
          hcaptcha.reset();
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      } catch (e) {
        msg.className = 'msg error';
        msg.textContent = 'Network error. Please try again.';
        hcaptcha.reset();
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
