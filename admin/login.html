<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Motowarehouse</title>
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 300; font-display: swap; src: url('/fonts/inter-latin-300-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/inter-latin-400-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/inter-latin-500-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/inter-latin-700-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: 'Inter'; font-style: italic; font-weight: 700; font-display: swap; src: url('/fonts/inter-latin-700-italic.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 900; font-display: swap; src: url('/fonts/inter-latin-900-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: 'Inter'; font-style: italic; font-weight: 900; font-display: swap; src: url('/fonts/inter-latin-900-italic.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  </style>
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #00171f;
      --surface:    #001e28;
      --surface-2:  #002330;
      --border:     #003040;
      --blue:       #009bb4;
      --teal-light: #00efd1;
      --white:      #ffffff;
      --text:       #cce8ed;
      --grey:       #5a8a95;
      --red:        #e54b4b;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* top gradient bar */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--blue) 0%, var(--teal-light) 100%);
      z-index: 100;
    }

    .wrap {
      width: 100%;
      max-width: 400px;
    }

    /* logo area */
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 36px;
      gap: 10px;
    }

    .logo-img-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      height: 48px;
      width: auto;
      display: block;
      border-radius: 8px;
      object-fit: contain;
    }

    .logo-mark-fallback {
      width: 48px;
      height: 48px;
      background: var(--blue);
      border-radius: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: white;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo-text-wrap {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .logo-name {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--white);
    }

    .logo-tagline {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--blue);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .portal-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--grey);
      background: rgba(0,155,180,0.08);
      border: 1px solid rgba(0,155,180,0.2);
      padding: 4px 12px;
      border-radius: 4px;
    }

    /* card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 28px 28px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--grey);
      margin-bottom: 6px;
      margin-top: 16px;
    }

    label:first-of-type { margin-top: 0; }

    input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--white);
      font-family: inherit;
      font-size: 15px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="password"]:focus { border-color: var(--blue); }

    .btn {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      background: linear-gradient(90deg, var(--blue) 0%, #00b8d4 100%);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .msg {
      font-size: 13px;
      font-weight: 500;
      padding: 10px 12px;
      border-radius: 7px;
      margin-bottom: 18px;
      display: none;
    }

    .msg.error   { background: rgba(229,75,75,0.12); color: var(--red); display: block; border: 1px solid rgba(229,75,75,0.2); }
    .msg.success { background: rgba(0,155,180,0.1); color: var(--teal-light); display: block; border: 1px solid rgba(0,155,180,0.2); }

    .h-captcha { margin-top: 20px; display: flex; justify-content: center; }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="logo">
      <div class="logo-img-wrap">
        <img class="logo-mark" src="/assets/MWH_Logo_New.png" alt="Motowarehouse"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <div class="logo-mark-fallback">MW</div>
        <div class="logo-text-wrap">
          <div class="logo-name">Motowarehouse</div>
          <div class="logo-tagline">Official Importer · Cyprus</div>
        </div>
      </div>
      <div class="portal-badge">Service Portal — Admin</div>
    </div>

    <div class="card">
      <div class="card-title">Admin Login</div>

      <div id="msg" class="msg"></div>

      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password"
        onkeydown="if(event.key==='Enter') doLogin()">

      <div class="h-captcha" data-sitekey="__HCAPTCHA_SITE_KEY__" data-theme="dark"></div>

      <button class="btn" id="loginBtn" onclick="doLogin()">Sign In</button>
    </div>

  </div>

  <script>
    async function doLogin() {
      const password = document.getElementById('password').value;
      const msg      = document.getElementById('msg');
      const btn      = document.getElementById('loginBtn');

      msg.className = 'msg';
      msg.textContent = '';

      if (!password) {
        msg.className = 'msg error';
        msg.textContent = 'Please enter your password.';
        return;
      }

      const captchaToken = hcaptcha.getResponse();

      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password, 'h-captcha-response': captchaToken })
        });
        const data = await res.json();

        if (res.ok) {
          msg.className = 'msg success';
          msg.textContent = 'Authenticated. Loading panel…';
          window.location.href = '/mw-service-solonas';
        } else {
          msg.className = 'msg error';
          msg.textContent = data.error || 'Login failed. Please try again.';
          hcaptcha.reset();
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      } catch (e) {
        msg.className = 'msg error';
        msg.textContent = 'Network error. Please try again.';
        hcaptcha.reset();
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
