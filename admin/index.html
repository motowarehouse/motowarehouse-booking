<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Motowarehouse Bookings</title>
  <style>
    @font-face { font-family:'SupremeLL'; src:url('/fonts/SupremeLLTT-Light.ttf'); font-weight:300; }
    @font-face { font-family:'SupremeLL'; src:url('/fonts/SupremeLLTT-Regular.ttf'); font-weight:400; }
    @font-face { font-family:'SupremeLL'; src:url('/fonts/SupremeLLTT-Medium.ttf'); font-weight:500; }
    @font-face { font-family:'SupremeLL'; src:url('/fonts/SupremeLLTT-Bold.ttf'); font-weight:700; }
    @font-face { font-family:'SupremeLL'; src:url('/fonts/SupremeLLTT-Black.ttf'); font-weight:900; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #009BB4;
      --blue-dark: #007a8f;
      --teal: #00EFD1;
      --dark: #0a1a1f;
      --dark2: #0f2429;
      --dark3: #1a3540;
      --grey: #8a9ba0;
      --grey-light: #d0dde0;
      --white: #ffffff;
      --red: #E50052;
      --green: #00c896;
      --orange: #f59e0b;
    }

    body {
      font-family: 'SupremeLL', Arial, sans-serif;
      background: var(--dark);
      color: var(--white);
      min-height: 100vh;
      font-weight: 300;
    }

    /* LOGIN SCREEN */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: var(--dark2);
      border: 1px solid rgba(0,155,180,0.2);
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .login-logo {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 8px;
    }

    .login-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 32px;
    }

    .login-input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: var(--white);
      font-family: 'SupremeLL', Arial, sans-serif;
      font-size: 15px;
      padding: 12px 16px;
      width: 100%;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-input:focus { border-color: var(--blue); }

    .login-btn {
      background: var(--blue);
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-family: 'SupremeLL', Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 13px;
      text-transform: uppercase;
      width: 100%;
      transition: background 0.2s;
    }

    .login-btn:hover { background: var(--blue-dark); }

    .login-error {
      background: rgba(229,0,82,0.12);
      border: 1px solid rgba(229,0,82,0.3);
      border-radius: 6px;
      color: #ff6b9d;
      font-size: 13px;
      margin-top: 12px;
      padding: 10px;
      display: none;
    }

    /* MAIN APP */
    .app { display: none; }

    /* SIDEBAR + LAYOUT */
    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--dark2);
      border-right: 1px solid rgba(0,155,180,0.12);
      width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-logo {
      padding: 24px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .sidebar-brand {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--blue);
    }

    .sidebar-sub {
      font-size: 13px;
      color: var(--grey);
      margin-top: 2px;
    }

    .sidebar-nav {
      padding: 16px 0;
      flex: 1;
    }

    .nav-item {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 400;
      color: var(--grey);
      border-left: 3px solid transparent;
      transition: all 0.15s;
    }

    .nav-item:hover { color: var(--white); background: rgba(255,255,255,0.03); }
    .nav-item.active { color: var(--white); border-left-color: var(--blue); background: rgba(0,155,180,0.08); }

    .nav-badge {
      background: var(--blue);
      border-radius: 10px;
      color: white;
      font-size: 10px;
      font-weight: 700;
      margin-left: auto;
      padding: 2px 7px;
    }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .logout-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: var(--grey);
      cursor: pointer;
      font-family: 'SupremeLL', Arial, sans-serif;
      font-size: 12px;
      padding: 8px 14px;
      width: 100%;
      transition: all 0.2s;
    }

    .logout-btn:hover { border-color: var(--red); color: var(--red); }

    /* MAIN CONTENT */
    .main {
      flex: 1;
      overflow-x: hidden;
    }

    .topbar {
      background: var(--dark2);
      border-bottom: 1px solid rgba(0,155,180,0.12);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar-title { font-size: 18px; font-weight: 700; }
    .topbar-date { font-size: 13px; color: var(--grey); }

    .content { padding: 28px; }

    /* STATS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px) { .stats-grid { grid-template-columns: 1fr; } }

    .stat-card {
      background: var(--dark2);
      border: 1px solid rgba(0,155,180,0.12);
      border-radius: 8px;
      padding: 20px;
    }

    .stat-label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--grey); margin-bottom: 8px; }
    .stat-value { font-size: 32px; font-weight: 900; line-height: 1; }
    .stat-value.pending { color: var(--orange); }
    .stat-value.accepted { color: var(--green); }
    .stat-value.cancelled { color: var(--red); }
    .stat-value.total { color: var(--blue); }

    /* FILTER TABS */
    .filter-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      background: var(--dark2);
      border-radius: 8px;
      padding: 4px;
      width: fit-content;
    }

    .filter-tab {
      background: none;
      border: none;
      border-radius: 6px;
      color: var(--grey);
      cursor: pointer;
      font-family: 'SupremeLL', Arial, sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 16px;
      transition: all 0.15s;
    }

    .filter-tab.active {
      background: var(--blue);
      color: white;
    }

    /* BOOKING CARDS */
    .bookings-list { display: flex; flex-direction: column; gap: 12px; }

    .booking-card {
      background: var(--dark2);
      border: 1px solid rgba(0,155,180,0.12);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .booking-card:hover { border-color: rgba(0,155,180,0.35); }
    .booking-card.pending { border-left: 3px solid var(--orange); }
    .booking-card.accepted { border-left: 3px solid var(--green); }
    .booking-card.cancelled { border-left: 3px solid var(--red); opacity: 0.6; }

    .booking-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
    }

    .booking-ref {
      font-size: 13px;
      font-weight: 700;
      color: var(--blue);
      min-width: 80px;
    }

    .booking-name {
      font-size: 15px;
      font-weight: 500;
      flex: 1;
    }

    .booking-datetime {
      font-size: 13px;
      color: var(--grey);
      min-width: 140px;
      text-align: right;
    }

    .booking-service {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 500;
    }

    .service-oil-change { background: rgba(0,155,180,0.15); color: var(--blue); }
    .service-small-service { background: rgba(0,200,150,0.12); color: var(--green); }
    .service-big-service { background: rgba(145,192,29,0.12); color: #91C01D; }

    .status-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .status-pending { background: rgba(245,158,11,0.15); color: var(--orange); }
    .status-accepted { background: rgba(0,200,150,0.15); color: var(--green); }
    .status-cancelled { background: rgba(229,0,82,0.12); color: var(--red); }

    .booking-detail {
      border-top: 1px solid rgba(255,255,255,0.06);
      display: none;
      padding: 16px 20px;
    }

    .booking-detail.open { display: block; }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 600px) { .detail-grid { grid-template-columns: 1fr 1fr; } }

    .detail-item label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--grey);
      display: block;
      margin-bottom: 3px;
    }

    .detail-item span {
      font-size: 14px;
      font-weight: 400;
    }

    .detail-notes {
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      color: var(--grey);
      font-size: 13px;
      margin-bottom: 16px;
      padding: 10px 14px;
    }

    .action-row { display: flex; gap: 10px; }

    .btn-accept {
      background: var(--green);
      border: none;
      border-radius: 6px;
      color: #0a1a1f;
      cursor: pointer;
      font-family: 'SupremeLL', Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 10px 20px;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }

    .btn-cancel-booking {
      background: none;
      border: 1px solid rgba(229,0,82,0.4);
      border-radius: 6px;
      color: var(--red);
      cursor: pointer;
      font-family: 'SupremeLL', Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 10px 20px;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .btn-cancel-booking:hover { background: rgba(229,0,82,0.1); }
    .btn-accept:hover { opacity: 0.85; }

    .btn-accept:disabled, .btn-cancel-booking:disabled { opacity: 0.4; cursor: not-allowed; }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--grey);
    }

    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* TODAY VIEW */
    .today-view { display: none; }

    .today-slot {
      background: var(--dark2);
      border: 1px solid rgba(0,155,180,0.12);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
      padding: 14px 18px;
    }

    .today-time {
      font-size: 18px;
      font-weight: 900;
      color: var(--blue);
      min-width: 60px;
    }

    .today-info { flex: 1; }
    .today-name { font-size: 15px; font-weight: 500; }
    .today-vehicle { font-size: 12px; color: var(--grey); margin-top: 2px; }

    @media print {
      .sidebar, .topbar, .filter-tabs, .action-row, .logout-btn { display: none !important; }
      .booking-detail { display: block !important; }
      body { background: white; color: black; }
    }

    /* Accent bar */
    .accent-bar { height: 3px; background: linear-gradient(90deg, var(--blue) 0%, var(--teal) 100%); }

    /* Spinner */
    .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,0.3); border-top-color:white; border-radius:50%; animation:spin 0.6s linear infinite; vertical-align:middle; margin-right:6px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--dark3);
      border: 1px solid rgba(0,155,180,0.3);
      border-radius: 8px;
      color: white;
      font-size: 14px;
      padding: 14px 20px;
      z-index: 999;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: rgba(0,200,150,0.5); }
    .toast.error { border-color: rgba(229,0,82,0.5); }
  </style>
</head>
<body>

<div class="accent-bar"></div>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-logo">Motowarehouse</div>
    <div class="login-title">Admin Panel</div>
    <input type="password" class="login-input" id="password-input" placeholder="Enter password" onkeydown="if(event.key==='Enter')login()">
    <button class="login-btn" onclick="login()">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-brand">CFMOTO</div>
        <div class="sidebar-sub">Service Bookings</div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-item active" id="nav-all" onclick="setView('all')">
          <span>📋</span> All Bookings
          <span class="nav-badge" id="badge-all">0</span>
        </div>
        <div class="nav-item" id="nav-pending" onclick="setView('pending')">
          <span>⏳</span> Pending
          <span class="nav-badge" id="badge-pending" style="background:var(--orange);">0</span>
        </div>
        <div class="nav-item" id="nav-accepted" onclick="setView('accepted')">
          <span>✅</span> Accepted
        </div>
        <div class="nav-item" id="nav-cancelled" onclick="setView('cancelled')">
          <span>❌</span> Cancelled
        </div>
        <div class="nav-item" id="nav-today" onclick="setView('today')">
          <span>📅</span> Today's Schedule
        </div>
      </nav>
      <div class="sidebar-footer">
        <button class="logout-btn" onclick="testEmail()" style="margin-bottom:8px;border-color:rgba(0,155,180,0.3);color:var(--blue);">📧 Test Email</button>
        <button class="logout-btn" onclick="logout()">Sign Out</button>
      </div>
    </div>

    <!-- MAIN -->
    <div class="main">
      <div class="topbar">
        <div class="topbar-title" id="topbar-title">All Bookings</div>
        <div class="topbar-date" id="topbar-date"></div>
      </div>
      <div class="content">

        <!-- Stats -->
        <div class="stats-grid" id="stats-grid">
          <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value pending" id="stat-pending">–</div></div>
          <div class="stat-card"><div class="stat-label">Accepted</div><div class="stat-value accepted" id="stat-accepted">–</div></div>
          <div class="stat-card"><div class="stat-label">Cancelled</div><div class="stat-value cancelled" id="stat-cancelled">–</div></div>
          <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value total" id="stat-total">–</div></div>
        </div>

        <!-- Bookings list -->
        <div id="bookings-view">
          <div class="bookings-list" id="bookings-list"></div>
        </div>

        <!-- Today view -->
        <div class="today-view" id="today-view"></div>

      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SVC = { 'oil-change':'Oil Change', 'small-service':'Small Service', 'big-service':'Big Service' };
  let allBookings = [];
  let currentView = 'all';
  let expandedId = null;

  // ── AUTH ────────────────────────────────────────────────────────────
  async function login() {
    const pw = document.getElementById('password-input').value;
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';

    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const data = await res.json();

    if (res.ok) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      initApp();
    } else {
      errEl.textContent = data.error || 'Login failed.';
      errEl.style.display = 'block';
    }
  }

  async function logout() {
    await fetch('/api/admin/logout', { method: 'POST' });
    location.reload();
  }

  async function checkAuth() {
    const res = await fetch('/api/admin/me');
    if (res.ok) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      initApp();
    }
  }

  // ── INIT ─────────────────────────────────────────────────────────────
  function initApp() {
    document.getElementById('topbar-date').textContent = new Date().toLocaleDateString('en-GB', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    loadBookings();
    setInterval(loadBookings, 30000); // auto-refresh every 30s
  }

  async function loadBookings() {
    const res = await fetch('/api/admin/bookings');
    if (!res.ok) return;
    allBookings = await res.json();
    updateStats();
    renderView();
  }

  // ── STATS ─────────────────────────────────────────────────────────────
  function updateStats() {
    const pending   = allBookings.filter(b => b.status === 'pending').length;
    const accepted  = allBookings.filter(b => b.status === 'accepted').length;
    const cancelled = allBookings.filter(b => b.status === 'cancelled').length;
    document.getElementById('stat-pending').textContent   = pending;
    document.getElementById('stat-accepted').textContent  = accepted;
    document.getElementById('stat-cancelled').textContent = cancelled;
    document.getElementById('stat-total').textContent     = allBookings.length;
    document.getElementById('badge-all').textContent      = allBookings.length;
    document.getElementById('badge-pending').textContent  = pending;
  }

  // ── VIEWS ──────────────────────────────────────────────────────────────
  const VIEW_TITLES = { all:'All Bookings', pending:'Pending', accepted:'Accepted', cancelled:'Cancelled', today:"Today's Schedule" };

  function setView(view) {
    currentView = view;
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById('nav-' + view).classList.add('active');
    document.getElementById('topbar-title').textContent = VIEW_TITLES[view];
    renderView();
  }

  function renderView() {
    const bookingView = document.getElementById('bookings-view');
    const todayView   = document.getElementById('today-view');
    const statsGrid   = document.getElementById('stats-grid');

    if (currentView === 'today') {
      bookingView.style.display = 'none';
      todayView.style.display = 'block';
      statsGrid.style.display = 'none';
      renderToday();
      return;
    }

    bookingView.style.display = 'block';
    todayView.style.display = 'none';
    statsGrid.style.display = 'grid';

    let filtered = allBookings;
    if (currentView !== 'all') filtered = allBookings.filter(b => b.status === currentView);

    // Sort: pending first, then by date
    filtered = [...filtered].sort((a, b) => {
      if (a.status === 'pending' && b.status !== 'pending') return -1;
      if (b.status === 'pending' && a.status !== 'pending') return 1;
      return new Date(a.date + 'T' + a.time) - new Date(b.date + 'T' + b.time);
    });

    const list = document.getElementById('bookings-list');
    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>No ${currentView === 'all' ? '' : currentView} bookings.</p></div>`;
      return;
    }

    list.innerHTML = filtered.map(b => bookingCard(b)).join('');
  }

  function renderToday() {
    const todayStr = new Date().toISOString().split('T')[0];
    const todayBookings = allBookings
      .filter(b => b.date === todayStr && b.status === 'accepted')
      .sort((a,b) => a.time.localeCompare(b.time));

    const el = document.getElementById('today-view');
    if (todayBookings.length === 0) {
      el.innerHTML = `<div class="empty-state"><div class="icon">🏖️</div><p>No accepted appointments for today.</p></div>`;
      return;
    }

    el.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <div style="font-size:16px;font-weight:700;">${todayBookings.length} appointment${todayBookings.length>1?'s':''} today</div>
        <button onclick="window.print()" style="background:none;border:1px solid rgba(255,255,255,0.15);border-radius:6px;color:var(--grey);cursor:pointer;font-size:12px;padding:7px 14px;">🖨️ Print</button>
      </div>
      ${todayBookings.map(b => `
        <div class="today-slot">
          <div class="today-time">${b.time}</div>
          <div class="today-info">
            <div class="today-name">${b.name}</div>
            <div class="today-vehicle">${b.year} ${b.model} · ${b.plate} · ${SVC[b.serviceType]}</div>
          </div>
          <div style="font-size:13px;color:var(--grey);">${b.phone}</div>
        </div>
      `).join('')}
    `;
  }

  function bookingCard(b) {
    const svcClass = 'service-' + b.serviceType;
    const isExpanded = expandedId === b.id;

    const actions = b.status === 'pending' ? `
      <div class="action-row">
        <button class="btn-accept" onclick="acceptBooking(${b.id}, event)">✓ Accept & Confirm</button>
        <button class="btn-cancel-booking" onclick="cancelBooking(${b.id}, event)">✕ Cancel</button>
      </div>
    ` : `<div style="font-size:12px;color:var(--grey);">Updated: ${b.updatedAt ? new Date(b.updatedAt).toLocaleString('en-GB') : '—'}</div>`;

    return `
      <div class="booking-card ${b.status}" id="card-${b.id}">
        <div class="booking-header" onclick="toggleExpand(${b.id})">
          <div class="booking-ref">${b.ref}</div>
          <div class="booking-name">${b.name}</div>
          <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
            <span class="booking-service ${svcClass}">${SVC[b.serviceType]}</span>
            <span class="status-badge status-${b.status}">${b.status}</span>
          </div>
          <div class="booking-datetime">${b.date}<br>${b.time}</div>
        </div>
        <div class="booking-detail ${isExpanded ? 'open' : ''}" id="detail-${b.id}">
          <div class="detail-grid">
            <div class="detail-item"><label>Phone</label><span>${b.phone}</span></div>
            <div class="detail-item"><label>Email</label><span>${b.email || '—'}</span></div>
            <div class="detail-item"><label>Plate</label><span>${b.plate}</span></div>
            <div class="detail-item"><label>Model</label><span>${b.model}</span></div>
            <div class="detail-item"><label>Year</label><span>${b.year}</span></div>
            <div class="detail-item"><label>Current KM</label><span>${b.km ? Number(b.km).toLocaleString() + ' km' : '—'}</span></div>
            <div class="detail-item"><label>Booked</label><span>${new Date(b.createdAt).toLocaleString('en-GB')}</span></div>
          </div>
          ${b.notes ? `<div class="detail-notes">📝 ${b.notes}</div>` : ''}
          ${actions}
        </div>
      </div>
    `;
  }

  function toggleExpand(id) {
    expandedId = expandedId === id ? null : id;
    renderView();
  }

  // ── ACTIONS ────────────────────────────────────────────────────────────
  async function acceptBooking(id, e) {
    e.stopPropagation();
    if (!confirm('Accept this booking and send confirmation to the customer?')) return;
    const btn = e.target;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Sending…';

    const res = await fetch(`/api/admin/bookings/${id}/accept`, { method: 'POST' });
    const data = await res.json();

    if (res.ok) {
      showToast('✅ Booking accepted – confirmation sent!', 'success');
      await loadBookings();
    } else {
      showToast('Error: ' + (data.error || 'Unknown error'), 'error');
      btn.disabled = false;
      btn.innerHTML = '✓ Accept & Confirm';
    }
  }

  async function cancelBooking(id, e) {
    e.stopPropagation();
    if (!confirm('Cancel this booking? The customer will be notified and asked to call to reschedule.')) return;
    const btn = e.target;
    btn.disabled = true;

    const res = await fetch(`/api/admin/bookings/${id}/cancel`, { method: 'POST' });
    const data = await res.json();

    if (res.ok) {
      showToast('Booking cancelled – customer notified.', 'success');
      await loadBookings();
    } else {
      showToast('Error: ' + (data.error || 'Unknown error'), 'error');
      btn.disabled = false;
    }
  }

  // ── TOAST ──────────────────────────────────────────────────────────────
  let _toastTimer = null;
  function showToast(msg, type = '', duration = 5000) {
    const t = document.getElementById('toast');
    if (_toastTimer) clearTimeout(_toastTimer);
    t.textContent = msg;
    t.className = 'toast show ' + type;
    _toastTimer = setTimeout(() => { t.className = 'toast'; }, duration);
  }

  // ── TEST EMAIL ────────────────────────────────────────────────────────
  async function testEmail() {
    showToast('⏳ Sending test email… please wait', '', 30000); // hold while waiting
    try {
      const res  = await fetch('/api/admin/test-email', { method: 'POST' });
      const data = await res.json();
      if (res.ok) showToast('✅ ' + data.message, 'success', 8000);
      else        showToast('❌ Error: ' + (data.error || 'Unknown') + (data.code ? ' (' + data.code + ')' : ''), 'error', 10000);
    } catch (e) {
      showToast('❌ Network error — check Railway logs', 'error', 8000);
    }
  }

  // ── START ──────────────────────────────────────────────────────────────
  checkAuth();
</script>

</body>
</html>
